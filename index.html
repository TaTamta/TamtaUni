<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Tamta University</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: a registrar-style portal. One top bar with a scrolling nav row, then a single column of panels; course identity carried by a mono course number and one hue per course. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --sunk:#E9EDF2; --ink:#16202E; --muted:#596578; --line:#D8DEE6;
  --accent:#1F3A6E; --on-accent:#FFFFFF;
  --math:#6541C2; --comp:#0B7F72; --brain:#B93A64;
  --good:#1B7F51; --warn:#9A6408; --crit:#B3372B;
  --display:"Space Grotesk","Inter",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F141B; --surface:#171E28; --sunk:#1E2733; --ink:#E6EBF2; --muted:#9BA7B7; --line:#2B3645;
  --accent:#9DB8F2; --on-accent:#0F141B;
  --math:#AE95FA; --comp:#4FD1BD; --brain:#F08CAB;
  --good:#5BCB93; --warn:#E3B052; --crit:#F0857A; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0F141B; --surface:#171E28; --sunk:#1E2733; --ink:#E6EBF2; --muted:#9BA7B7; --line:#2B3645;
  --accent:#9DB8F2; --on-accent:#0F141B;
  --math:#AE95FA; --comp:#4FD1BD; --brain:#F08CAB;
  --good:#5BCB93; --warn:#E3B052; --crit:#F0857A; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px;padding-block:14px 8px}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.01em;color:var(--ink);text-decoration:none}
.brand small{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.04em;margin-left:8px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync[data-s="cloud"] i{background:var(--good)} .sync[data-s="saving"] i{background:var(--warn)} .sync[data-s="slow"] i{background:var(--crit)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;padding:8px 10px;font-size:13.5px;font-weight:500;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-block:24px 56px;display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--display);font-size:28px;line-height:1.15;letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-size:17px;margin:0;letter-spacing:-.01em}
h3{font-size:13px;margin:0;font-weight:600}
p{margin:0}
.lede{color:var(--muted);max-width:65ch}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.code{font-family:var(--mono);font-weight:600;color:var(--c,var(--ink))}
.c-math{--c:var(--math)} .c-comp{--c:var(--comp)} .c-brain{--c:var(--brain)}
.head{display:flex;flex-direction:column;gap:6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel>.ph{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px}
.pill{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.good{color:var(--good)} .pill.warn{color:var(--warn)} .pill.crit{color:var(--crit)} .pill.now{background:var(--accent);color:var(--on-accent)}
.tasks{display:flex;flex-direction:column}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.tasks>.task:first-child{border-top:0}
.task input[type=checkbox]{width:17px;height:17px;margin:2px 0 0;accent-color:var(--c,var(--accent))}
.task .tl{min-width:0;overflow-wrap:anywhere}
.task .tl b{font-family:var(--mono);font-weight:600;font-size:12.5px;color:var(--c,var(--ink));margin-right:6px}
.task .tl small{display:block;color:var(--muted);font-size:12.5px}
.task.done .tl{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.task .meta{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.task .meta.late{color:var(--crit);font-weight:600}
.score{width:58px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:14px}
.meter{height:8px;border-radius:999px;background:var(--sunk);overflow:hidden}
.meter>span{display:block;height:100%;background:var(--c,var(--accent));border-radius:999px}
.stat{font-family:var(--display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.stat small{font-family:var(--body);font-size:13px;font-weight:400;color:var(--muted);margin-left:6px}
.course-card{text-decoration:none;color:inherit}
.course-card:hover{border-color:var(--c)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{font-size:13px;font-weight:500;padding:5px 10px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--ink);background:var(--bg)}
.links a:hover{border-color:var(--accent)}
.week{scroll-margin-top:12px}
.week.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.wkcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:4px 20px}
.wkcols h3{padding-bottom:4px;border-bottom:1px solid var(--line)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:12px;font-weight:600;color:var(--muted);border-top:0;white-space:nowrap}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
ol.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px;max-width:70ch}
.passes{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.passes .dots{display:flex;gap:6px}
.passes .dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent);display:block}
.passes .dots i.used{background:var(--accent)}
button.btn{font:inherit;font-size:13px;font-weight:500;padding:5px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
button.btn:hover{border-color:var(--accent)} button.btn:disabled{opacity:.45;cursor:default}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px 24px}
.stats>div{display:flex;flex-direction:column;gap:6px;min-width:0}
.stats .stat{font-size:22px}
.cal{display:grid;grid-template-columns:52px repeat(7,minmax(90px,1fr));min-width:720px;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.cal>div{background:var(--surface);padding:6px 7px;min-width:0}
.cal .ch{font-size:12px;font-weight:600;color:var(--muted)}
.cal .ch small{display:block;font-family:var(--mono);font-weight:600;color:var(--c,var(--muted))}
.cal .cw{font-family:var(--mono);font-size:12px;color:var(--muted)}
.cal .cw.cur{color:var(--accent);font-weight:600}
.cal .cd{min-height:66px;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.cal .cd.past{background:var(--bg)}
.cal .cd.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .dn{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.cal .cd.today .dn{color:var(--accent);font-weight:600}
.cal .note{font-size:11px;color:var(--muted)}
.chip{font-family:var(--mono);font-size:11px;font-weight:600;line-height:1.5;padding:0 6px;border-radius:5px;border:1px solid transparent;color:var(--c,var(--ink));background:color-mix(in srgb,var(--c,var(--ink)) 14%,transparent);white-space:nowrap}
.chip.due{background:none;border:1px dashed var(--c)}
.chip.ex{background:var(--c);color:var(--surface)}
.chip.done{opacity:.5;text-decoration:line-through}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);align-items:center}
.day{display:grid;grid-template-columns:130px minmax(0,1fr);gap:4px 16px;padding:10px 0;border-top:1px solid var(--line)}
.days>.day:first-child{border-top:0}
.day .dname{font-weight:600} .day .dname small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.day.today .dname{color:var(--accent)}
.day .duel{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-top:4px}
@media (max-width:520px){ .day{grid-template-columns:1fr} }
.login{max-width:380px;margin:32px auto 0;width:100%}
.login form{display:flex;flex-direction:column;gap:8px}
.login label{font-size:13px;font-weight:500;color:var(--muted)}
.login input{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);margin-bottom:6px}
.login .err{color:var(--crit);font-size:13.5px}
button.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);padding:9px 12px;font-weight:600}
.right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
footer{color:var(--muted);font-size:12.5px;padding-block:0 32px}
@media (max-width:520px){ h1{font-size:23px} .task{grid-template-columns:auto 1fr} .task .meta{grid-column:2} }
@media (prefers-reduced-motion:no-preference){ .meter>span{transition:width .25s ease} }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="bar">
      <a class="brand" href="#home">Tamta University<small>EST. NOV 2026 · TBILISI</small></a>
      <div class="right"><div class="sync" id="sync" data-s="local" hidden><i></i><span id="syncText">Progress saved on this device</span></div><button class="btn" id="signout" type="button" hidden>Sign out</button></div>
    </div>
    <nav class="tabs" id="nav" aria-label="Portal sections"></nav>
  </div>
</header>
<div class="wrap"><main id="main"></main>
<footer>Course materials are from MIT OpenCourseWare. This portal is a personal study plan and is not affiliated with MIT.</footer></div>

<script>
(function(){
"use strict";
var OCW="https://ocw.mit.edu/courses/";
var COURSES={
 math:{code:"6.042J",name:"Mathematics for Computer Science",term:"Fall 2010",role:"Serious · math and proofs",hours:8,

  lec:["Introduction and proofs","Induction","Strong induction","Number theory I","Number theory II","Graph theory and coloring","Matching problems","Graph theory II: minimum spanning trees","Communication networks","Graph theory III","Relations, partial orders, and scheduling","Sums","Sums and asymptotics","Divide and conquer recurrences","Linear recurrences","Counting rules I","Counting rules II","Probability introduction","Conditional probability","Independence","Random variables","Expectation I","Expectation II","Large deviations","Random walks"],
  lw:{1:[1],2:[2,3],3:[4],4:[5,6],5:[7],6:[8,9],7:[10,11],8:[12,13],9:[14],10:[15],11:[16,17],12:[18],13:[19,20],14:[21,22],15:[23,24],16:[25]},
  ps:{2:1,3:2,4:3,6:4,7:5,8:6,9:7,11:8,12:9,13:10,14:11,15:12},

  lecMap:{1:"Introduction",2:"Neuroanatomy",4:"Cognitive neuroscience methods I",5:"Cognitive neuroscience methods II",7:"Category selectivity, controversies, and MVPA",8:"Navigation I",9:"Navigation II",10:"Development, nature and nurture I",11:"Development, nature and nurture II",13:"Number",15:"Hearing and speech",16:"Music",18:"Language I",20:"Mentalizing and theory of mind",21:"Brain networks",23:"Deep networks",24:"Attention and awareness"},

};
var ORDER=["math","comp","brain"];
var DAYS=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
var RHYTHM=[["math",2,"Lecture and notes"],["comp",2,"Lecture, then run and change the lecture code"],["math",2,"Second lecture, or textbook chapter and problem set start"],["comp",2,"Problem set"],["brain",2,"Lecture"],["math",3,"Problem set"],[null,3,"One hour each: finish the 6.042J problem set, finish 6.0002 work, 9.13 reading response. Then the weekly check-in."]];
var START=new Date(2026,10,16), WEEKS=17, DAY=864e5;

/* ---- build the task list ---- */
var TASKS=[], BYID={};
function add(t){TASKS.push(t);BYID[t.id]=t}
ORDER.forEach(function(k){var c=COURSES[k];
  for(var w=1;w<=WEEKS;w++){
    (c.lw[w]||[]).forEach(function(n,i){
      var title=c.lec?c.lec[n-1]:c.lecMap[n];
      var day=k==="math"?(i?2:0):k==="comp"?1:(i?6:4);
      add({id:k+"-L"+n,k:k,type:"L",n:n,tag:"L"+n,label:title,week:w,day:day,sub:c.read?("Guttag "+c.read[n-1]):""});
    });
    if(c.ps&&c.ps[w]){var p=c.ps[w];add({id:k+"-PS"+p,k:k,type:"PS",n:p,tag:"PS"+p,label:c.psName?c.psName[p-1]:"Problem set "+p,week:w,day:k==="math"?5:3});}
    if(c.rr&&c.rr[w]){var r=c.rr[w];add({id:k+"-RR"+r,k:k,type:"RR",n:r,tag:"RR"+r,label:"Reading response "+r,week:w,day:6,href:c.base+"pages/assignments/assignment-"+r+"/"});}
    c.extra.forEach(function(e){if(e.w===w)add({id:k+"-"+e.id,k:k,type:e.type,tag:e.type==="EX"?"EXAM":"PREP",label:e.label,sub:e.sub||"",week:w,day:e.day});});
  }
});

/* ---- dates ---- */
function wkStart(w){return new Date(START.getTime()+(w<=6?w-1:w)*7*DAY+36e5*0)}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function fmt(d){return d.toLocaleDateString("en-GB",{day:"numeric",month:"short"})}
function wkRange(w){var s=addDays(START,(w<=6?w-1:w)*7);return fmt(s)+" – "+fmt(addDays(s,6))}
function now(){var t=new Date();t.setHours(0,0,0,0);var off=Math.floor(Math.round((t-START)/DAY)/7);var dow=(t.getDay()+6)%7;
  if(t<START)return{phase:"pre",days:Math.round((START-t)/DAY),week:0,dow:dow};
  if(off===6)return{phase:"break",week:6.5,dow:dow};
  if(off>17)return{phase:"done",week:18,dow:dow};
  return{phase:"term",week:off<6?off+1:off,dow:dow};}

function today0(){var t=new Date();t.setHours(0,0,0,0);return t}
function wkDate(w,day){return addDays(START,(w<=6?w-1:w)*7+day)}
function isDue(t){return t.type==="PS"||t.type==="RR"}
function dueDate(t){return wkDate(t.week,isDue(t)?6:t.day)}
function daysTo(d){return Math.round((d-today0())/DAY)}
function inDays(n){return n<0?(-n)+(n===-1?" day late":" days late"):n===0?"today":n===1?"tomorrow":"in "+n+" days"}
function longDate(d){return d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})}
function streak(){var days={};Object.keys(state.done).forEach(function(k){var v=state.done[k];if(typeof v==="number"&&v>1){var d=new Date(v);d.setHours(0,0,0,0);days[d.getTime()]=1}});
  var t=today0(),n=0;if(!days[t.getTime()])t=addDays(t,-1);while(days[t.getTime()]){n++;t=addDays(t,-1)}return{n:n,today:!!days[today0().getTime()]}}

/* ---- state and saving ---- */
var KEY="tamta-university-progress";
var state={done:{},scores:{},late:0,updatedAt:0};
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&p.done)state={done:p.done||{},scores:p.scores||{},late:p.late||0,updatedAt:p.updatedAt||0};}}catch(e){}

  return '<div class="head"><span class="eyebrow">All courses</span><h1>Homework</h1><p class="lede">Tick an item when it is submitted and graded. Problem sets are scored out of 10. Attempt each problem for 30 minutes before asking Claude for a hint.</p></div><section class="panel"><div class="ph"><h2>To do</h2><span class="pill">'+open.length+' left</span></div>'+list(open,{course:true,meta:"due",score:true,n:n},"All homework is done.")+'</section><section class="panel"><div class="ph"><h2>Done</h2><span class="pill">'+done.length+'</span></div>'+list(done,{course:true,meta:"due",score:true},"Nothing finished yet.")+'</section>'}
function vExams(){var n=now(),E=TASKS.filter(function(t){return t.type==="EX"}).sort(function(a,b){return a.week-b.week});
  return '<div class="head"><span class="eyebrow">All courses</span><h1>Exams</h1><p class="lede">Exams are timed, in one sitting, phone away, and graded the same day. Enter each score as a percentage. Do not open the 6.042J 2010 midterm or 2008 final before exam day.</p></div><section class="panel">'+list(E,{course:true,meta:"due",score:true,n:n},"")+'</section><section class="panel"><h2>Practice material</h2>'+list(TASKS.filter(function(t){return t.type==="PR"}),{course:true,meta:"week"},"")+'<div class="links"><a href="'+COURSES.math.base+'pages/exams/" target="_blank" rel="noopener">6.042J exams and solutions</a></div></section>'}
function vGrades(){var h='<div class="head"><span class="eyebrow">Transcript</span><h1>Grades</h1><p class="lede">Grades update from the scores you enter on the Homework and Exams pages. A course is passed at 60% or higher. Until the final is in, the grade covers only what has been graded.</p></div><section class="panel"><div class="tbl"><table><thead><tr><th>Course</th><th>Homework</th><th>Midterm</th><th>Final</th><th>Current</th><th>Grade</th></tr></thead><tbody>';
  ORDER.forEach(function(k){var c=COURSES[k],g=grade(k);h+='<tr class="c-'+k+'"><td><span class="code">'+c.code+'</span><br>'+esc(c.name)+'</td><td class="num">'+pc(g.hw)+'</td><td class="num">'+(g.mid===undefined?"None":pc(g.mid))+'</td><td class="num">'+pc(g.fin)+'</td><td class="num">'+pc(g.total)+'</td><td>'+(g.letter?'<span class="pill '+(g.letter==="Below pass"?"crit":"good")+'">'+g.letter+(g.final?"":" so far")+'</span>':'–')+'</td></tr>'});
  h+='</tbody></table></div></section><div class="grid2"><section class="panel"><h2>Weights</h2><dl class="kv">'+ORDER.map(function(k){return '<dt class="code c-'+k+'">'+COURSES[k].code+'</dt><dd>'+esc(COURSES[k].weights)+'</dd>'}).join("")+'</dl></section><section class="panel"><h2>Scale</h2><dl class="kv"><dt>A</dt><dd>88–100%</dd><dt>B</dt><dd>75–87.9%</dd><dt>C</dt><dd>60–74.9%</dd><dt>Not passed</dt><dd>Below 60%</dd></dl></section></div>';
  return h}
function vRoadmap(){var S=[["Semester 1","Nov 2026 – Mar 2027","In progress",[["6.042J","Mathematics for Computer Science"],["6.0002","Computational Thinking and Data Science"],["9.13","The Human Brain"]]],["Semester 2","Apr – Aug 2027","Proposed",[["6.006","Introduction to Algorithms (Spring 2020)"],["18.06SC","Linear Algebra (Fall 2011)"],["15.401","Finance Theory I (Fall 2008), lectures only"]]],["Semester 3","Sep 2027 – Jan 2028","Proposed",[["18.05","Introduction to Probability and Statistics (Spring 2022)"],["6.034","Artificial Intelligence (Fall 2010)"],["14.01","Principles of Microeconomics (Fall 2018)"]]]];
  return '<div class="head"><span class="eyebrow">Degree plan</span><h1>Roadmap</h1><p class="lede">Math foundations first, then algorithms, then machine learning. Semesters 2 and 3 are proposals to confirm at each end-of-semester review.</p></div><div class="grid3">'+S.map(function(s,i){return '<section class="panel"><div class="ph"><h2>'+s[0]+'</h2><span class="pill'+(i?"":" now")+'">'+s[2]+'</span></div><span class="eyebrow">'+s[1]+'</span><dl class="kv">'+s[3].map(function(c,j){return '<dt class="code">'+c[0]+'</dt><dd>'+c[1]+(j===2?' <span class="empty">· light</span>':'')+'</dd>'}).join("")+'</dl></section>'}).join("")+'</div><section class="panel"><h2>Gates</h2><ol class="rules"><li>Start 6.006 only after passing 6.042J with a C or better. It needs the proofs, graphs and asymptotics from 6.042J.</li><li>If 6.042J is not passed, Semester 2 becomes: finish 6.042J, 18.06SC, and the light course.</li><li>Semester 2 has two full-size serious courses, so expect about 20 weeks at 16 hours a week.</li><li>Later options: 6.046J Design and Analysis of Algorithms after 6.006, and 6.036 Introduction to Machine Learning after 18.06SC and 18.05.</li><li>Check that each course edition is still listed on OCW before a semester starts. The Semester 2 and 3 courses have not been re-checked.</li></ol></section>'}
function vRules(){var used=state.late||0,dots='';for(var i=0;i<4;i++)dots+='<i class="'+(i<used?"used":"")+'"></i>';
  return '<div class="head"><span class="eyebrow">Handbook</span><h1>Rules</h1><p class="lede">The rules exist to keep the semester alive through bad weeks. Finishing slowly beats quitting.</p></div><section class="panel"><div class="ph"><h2>Late passes</h2><span class="pill">'+(4-used)+' of 4 left</span></div><div class="passes"><div class="dots" role="img" aria-label="'+used+' of 4 late passes used">'+dots+'</div><button class="btn" id="pass-use" data-pass="1"'+(used>=4?" disabled":"")+'>Use a late pass</button><button class="btn" id="pass-undo" data-pass="-1"'+(used<=0?" disabled":"")+'>Undo</button></div><p class="empty">Each pass moves one deadline by a week with no penalty.</p></section><section class="panel"><h2>University rules</h2><ol class="rules"><li><strong>Attempt before asking.</strong> Spend at least 30 minutes on a problem before asking Claude for a hint, and ask for hints before solutions.</li><li><strong>Minimum week.</strong> In a bad week, do 5 hours: one 6.042J lecture, one 6.0002 lecture, and one honest attempt at the current 6.042J problem set. A minimum week still counts as attended.</li><li><strong>Falling behind.</strong> If you are more than one week behind in 6.042J, shift the whole schedule back a week. Do not cram two weeks into one.</li><li><strong>What to drop first.</strong> Pause 9.13 first, then 6.0002. 6.042J is the core course and the last one to pause.</li><li><strong>Break week.</strong> 28 December to 3 January has no new work.</li><li><strong>Exams are real.</strong> Timed, in one sitting, phone away. Grade them the same day.</li><li><strong>End of semester.</strong> After week 17, do a one-hour review with Claude: grades, what worked, what to change, and the course choices for Semester 2.</li></ol></section><section class="panel"><div class="ph"><h2>Weekly rhythm</h2><span class="pill">16 hours</span></div><div class="tbl"><table><thead><tr><th>Day</th><th>Hours</th><th>Course</th><th>What</th></tr></thead><tbody>'+RHYTHM.map(function(r,i){return '<tr><td>'+DAYS[i]+'</td><td class="num">'+r[1]+'</td><td>'+(r[0]?'<span class="code c-'+r[0]+'">'+COURSES[r[0]].code+'</span>':'All three')+'</td><td>'+esc(r[2])+'</td></tr>'}).join("")+'</tbody></table></div><p class="empty">From week 15, 6.0002 is finished and its 5 hours go to 6.042J final preparation.</p></section>'}

var VIEWS={home:vHome,calendar:vCalendar,schedule:vSchedule,math:function(){return vCourse("math")},comp:function(){return vCourse("comp")},brain:function(){return vCourse("brain")},homework:vHomework,exams:vExams,grades:vGrades,roadmap:vRoadmap,rules:vRules};
function route(){var r=location.hash.replace("#","");return VIEWS[r]?r:"home"}
function render(){var r=route(),a=document.activeElement,fid=a&&a.id;
  document.getElementById("sync").hidden=!authed;document.getElementById("signout").hidden=!authed;
  if(!authed){document.getElementById("nav").innerHTML="";document.getElementById("main").innerHTML=vLogin();return}
  document.getElementById("nav").innerHTML=NAV.map(function(x){return '<a href="#'+x[0]+'"'+(x[0]===r?' aria-current="page"':'')+'>'+x[1]+'</a>'}).join("");
  document.getElementById("main").innerHTML=VIEWS[r]();
  if(fid){var f=document.getElementById(fid);if(f)f.focus({preventScroll:true})}}
var main=document.getElementById("main");
main.addEventListener("change",function(e){var t=e.target;
  if(t.dataset.task){if(t.checked)state.done[t.dataset.task]=Date.now();else delete state.done[t.dataset.task];persist();render()}
  else if(t.dataset.score){var v=t.value.trim(),id=t.dataset.score,max=+t.max;if(v===""||isNaN(+v))delete state.scores[id];else{var x=Math.max(0,Math.min(max,+v));state.scores[id]=x;t.value=x;if(!state.done[id]){state.done[id]=Date.now();var cb=document.getElementById("cb-"+id);if(cb){cb.checked=true;cb.closest(".task").classList.add("done")}}}persist()}});
main.addEventListener("click",function(e){var b=e.target.closest("[data-pass]");if(!b)return;state.late=Math.max(0,Math.min(4,(state.late||0)+(+b.dataset.pass)));persist();render()});
window.addEventListener("hashchange",function(){render();window.scrollTo(0,0)});
render();
if(route()==="schedule"){var n0=now(),el=document.getElementById(n0.phase==="break"?"wk-break":"wk-"+n0.week);if(el)el.scrollIntoView()}
connect();
})();
</script>
</body>
</html>
